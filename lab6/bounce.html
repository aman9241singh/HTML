<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bouncing three Dots</title>

    <style>
        body {
            background-color: rgb(249, 243, 243);
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader {
            display: flex;
            gap: 15px;
        }
        .loader div {
            width: 20px;
            height: 20px;
            background-color: rgb(148, 6, 72);
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }
        .loader div:nth-child(2) {
         animation-delay: 0.2s;

        }
        .loader div:nth-child(3) {
            animation-delay: 0.4s;
        }
    

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(50px);
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
        
    </div>
</body>
</html>
