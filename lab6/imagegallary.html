<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    h2{
      text-align: center;
    }
    .photo
    {
      width:20%;
    }
    .photo img{
      width:100%;
      height: 300px;
      object-fit: cover;
      background-color:lightgray;
      border-radius: 7px;
      margin: right;
    
    }
    .photo img:hover
    {
      transform: scale(1.05);
      border: 2px solid rgb(165, 23, 23);
    }
    .gallery
    {
      display:flex;
      gap:30px;
      flex-wrap: wrap;
      justify-content: center;

    }
    @media (max-width:700px) {
        .photo
        {
          width: 40%;
        }
    }
    @media (max-width:400px) {
        .photo
        {
          width: 80%;
        }
    }
  </style>
</head>
<body>
  <h2>Photo Gallery</h2>
  <div class="gallery">

        <div class="photo">
            <a  target = "_blank" href="1.jpg">
            <img src="1.jpg" alt="Photo 1">
            </a>
        </div>
        <div class="photo">
             <a  target = "_blank" href="2.jpg">
            <img src="2.jpg" alt="Photo 2">
            </a>
        </div>
        <div class="photo">
             <a  target = "_blank" href="3.jpg">
            <img src="3.jpg" alt="Photo 3">
            </a>
        </div>
        <div class="photo">
            <a  target = "_blank" href="4.jpg">
            <img src="4.jpg" alt="Photo 4">
            </a>
        </div>
        <div class="photo">
            <a  target = "_blank" href="5.jpg">
            <img src="5.jpg" alt="Photo 5">
            </a>
        </div>
        <div class="photo">
            <a  target = "_blank" href="6.jpg">
            <img src="6.jpg" alt="Photo 6">
            </a>
        </div>
        <div class="photo">
            <a  target = "_blank" href="7.jpg">
            <img src="7.jpg" alt="Photo 7">
            </a>
        </div>
        <div class="photo">
            <a  target = "_blank" href="8.jpg">
            <img src="8.jpg" alt="Photo 8">
            </a>
        </div>

    </div>
</body>
</html>
